name: Bug report
description: 报告可复现的 bug；请先脱敏，不要上传真实素材库
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要在 issue 中上传真实素材库（`index.json`、`orig/`、`prev/`）、签名密钥或私人路径。
        安全问题请走 `SECURITY.md` 中的私密报告渠道。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 桌面端 / 手机端版本号，例如 0.3.0 / 0.2.8
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统
      description: 操作系统和版本
      placeholder: "Windows 11 23H2 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，包含最小样例（不要用真实私人素材）
      placeholder: "1. 打开...\n2. 拖入...\n3. 看到..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 请先脱敏；不要上传真实素材库或密钥
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已确认这不是安全问题（安全问题走私密报告）
          required: true
        - label: 我已移除 issue 中的私人素材、路径和密钥
          required: true
