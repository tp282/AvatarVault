name: Feature request
description: 提出功能建议；请说明使用场景和期望行为
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？现在的做法哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 可以描述交互、数据格式或兼容性要求
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: compatibility
    attributes:
      label: 兼容性
      options:
        - label: 这个改动可能需要修改库格式或旧备份兼容逻辑
        - label: 这个改动只影响界面 / 交互
